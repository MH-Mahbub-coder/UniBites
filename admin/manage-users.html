<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniBites - Manage Users</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="dash-body">
    <aside class="dash-sidebar">
      <div class="dash-logo"><span>Uni</span><span>Bites</span></div>
      <div class="dash-entity">
        <div class="dash-entity-name">Administrator</div>
        <div class="dash-entity-role" style="color:#ff6b6b;">Admin Panel</div>
        <div class="dash-entity-email">admin@uiu.ac.bd</div>
      </div>
      <nav class="dash-nav">
        <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="manage-shops.html"><i class="fas fa-store"></i> Manage Shops</a>
        <a href="manage-users.html" class="active"><i class="fas fa-users"></i> Manage Users</a>
      </nav>
      <div class="dash-logout">
        <a href="#" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </div>
    </aside>

    <main class="dash-main">
      <div class="dash-topbar">
        <div>
          <div class="dash-title">Manage <span>Users</span></div>
          <div class="dash-subtitle">View and moderate student and rider accounts.</div>
        </div>
      </div>

      <div class="dash-tabs">
        <button class="dash-tab active" onclick="switchUserTab('all', this)">All Users</button>
        <button class="dash-tab" onclick="switchUserTab('rider', this)">Riders Only</button>
      </div>

      <div class="dash-panel">
        <div style="margin-bottom:16px;">
          <input type="text" class="form-control" placeholder="Search by name or email..." id="user-search" oninput="renderUsers()" style="max-width:320px;">
        </div>
        <table class="dash-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Balance</th><th>Total Earnings</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="users-table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="../js/cart.js"></script>
  <script>
    const admin = JSON.parse(sessionStorage.getItem('unibites_admin') || 'null');
    if (!admin) window.location.href = 'login.html';

    function adminLogout() {
      fetch('../logout.php', { method: 'POST' }).finally(() => {
        sessionStorage.removeItem('unibites_admin');
        window.location.href = 'login.html';
      });
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      const data = await res.json();
      if (!data.success && /log in|requires an admin|no longer active/i.test(data.message || '')) {
        sessionStorage.removeItem('unibites_admin');
        window.location.href = 'login.html';
      }
      return data;
    }

    let currentUserTab = 'all';
    window._users = [];

    function switchUserTab(tab, btn) {
      currentUserTab = tab;
      document.querySelectorAll('.dash-tabs .dash-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderUsers();
    }

    async function loadUsers() {
      try {
        const data = await api('../get_admin_users.php');
        if (!data.success) { showToast(data.message, 'error'); return; }
        window._users = data.users;
        renderUsers();
      } catch (err) {
        showToast('Could not load users.', 'error');
      }
    }

    function renderUsers() {
      const search = document.getElementById('user-search').value.toLowerCase();
      let users = window._users;

      if (currentUserTab === 'rider') users = users.filter(u => u.isRider);
      if (search) users = users.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));

      const tbody = document.getElementById('users-table-body');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:30px;">No users found.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr>
          <td class="strong">${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td>${escapeHtml(u.dept)}</td>
          <td>${u.isRider ? '<span class="pill pill-active">Student + Rider</span>' : '<span class="pill pill-inactive">Student</span>'}</td>
          <td class="strong">৳${u.balance.toLocaleString()}</td>
          <td class="strong">৳${u.earnings.toLocaleString()}</td>
          <td>${u.active ? '<span class="pill pill-active">Active</span>' : '<span class="pill pill-cancelled">Suspended</span>'}</td>
          <td>
            <div class="dash-table-actions">
              <button class="icon-btn" onclick="toggleUser(${u.id})" title="${u.active ? 'Suspend' : 'Reactivate'}"><i class="fas fa-${u.active ? 'ban' : 'check'}"></i></button>
              <button class="icon-btn danger" onclick="deleteUser(${u.id})" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`).join('');
    }

    async function toggleUser(id) {
      try {
        const data = await api('../toggle_user.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: id })
        });
        if (!data.success) { showToast(data.message, 'error'); return; }
        showToast(data.message);
        loadUsers();
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
      }
    }

    async function deleteUser(id) {
      if (!confirm('Delete this student account permanently?')) return;
      try {
        const data = await api('../delete_user.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: id })
        });
        if (!data.success) { alert(data.message); return; }
        showToast('Student account deleted.');
        loadUsers();
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
      }
    }

    loadUsers();
  </script>
</body>
</html>
